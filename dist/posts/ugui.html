<p>IMGUI(GUI、通常用来制作内置编辑器) -&gt; NGUI -&gt;UGUI-&gt;UIElements(开发内置编辑器功能)</p>
<p>UGUI是unity内置的UI开发工具</p>
<h2>1. 六大基础组件</h2>
<p>Rect Transform：UI对象位置锚点控制组件</p>
<p>Canvas：画布组件，用于渲染UI控件</p>
<p>Canvas Scaler：画布分辨率自适应</p>
<p>Graphic Raycaster：射线事件交互组件</p>
<p>EventSystem：玩家输入事件响应系统</p>
<p>Standalone Input Module：独立输入模块组件</p>
