<p><strong>readonly const关键字</strong></p>
<pre><code>readonly（运行时只读）在声明、构造函数中初始化
const (编译时只读) 声明时初始化
</code></pre>
<p><strong>sealed 关键字</strong></p>
<p>用于修饰重写基类的虚方法上，阻止派生类重写该方法。</p>
<p><strong>in ref out关键字</strong></p>
<pre><code>in :
    只读引用方式传递参数 避免复制大值类型的开销
ref :
    通过引用方式传递参数
    在调用函数或方法之前初始化
out :
    通过引用方式传递参数
    在调用函数/方法内部初始化（没有赋值会导致编译报错）
</code></pre>
<p><strong>同步和异步</strong></p>
<pre><code>同步：顺序执行
异步：并行执行
</code></pre>
